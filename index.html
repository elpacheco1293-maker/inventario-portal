<style>
:root{--bg:#0b0d1f;--p:#5b4cf0;--p2:#8b7bff;--card:rgba(255,255,255,.07);--b:rgba(255,255,255,.15);--t:#eef0ff;--m:#a4a9d0;--ok:#22c58b;--wa:#f5b942;--no:#ff6b81;--inp:rgba(255,255,255,.1);--sh:rgba(0,0,0,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#eef0ff;--card:rgba(255,255,255,.75);--b:rgba(91,76,240,.2);--t:#1b1d3a;--m:#5b6089;--inp:rgba(91,76,240,.08);--sh:rgba(60,50,160,.25)}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:var(--bg);overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;animation:fl 14s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:var(--p);top:-80px;left:-80px}.o2{width:320px;height:320px;background:#2fb7ff;bottom:-60px;right:-60px;animation-delay:-6s}
@keyframes fl{to{transform:translate3d(60px,40px,0) scale(1.15)}}
#app{position:relative;z-index:1;max-width:1100px;margin:auto;padding:16px}
.stage{perspective:1000px}.tilt{transform-style:preserve-3d;transition:transform .15s ease-out,box-shadow .2s}
.card{background:var(--card);border:1px solid var(--b);border-radius:20px;padding:18px;backdrop-filter:blur(14px);box-shadow:0 18px 40px var(--sh),inset 0 1px 0 rgba(255,255,255,.2);cursor:default}
.card.click{cursor:pointer}.card:hover{box-shadow:0 28px 60px var(--sh),inset 0 1px 0 rgba(255,255,255,.25)}
.card>*{transform:translateZ(18px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.top h2{margin:0;font-size:1.15rem;flex:1}
.ico{width:46px;height:46px;border-radius:13px;box-shadow:0 10px 20px var(--sh);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotateY(12deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.tile{padding:12px;border-radius:16px;text-align:center;border:1px solid var(--b);cursor:pointer;background:var(--card);box-shadow:0 8px 0 var(--c),0 16px 24px var(--sh);border-bottom:0;margin-bottom:8px}
.tile b{font-size:1.15rem;display:block}.tile small{color:var(--m);display:block;font-size:.68rem;min-height:2em;overflow:hidden}
.tile.s{--c:#14805a}.tile.p{--c:#a87b14}.tile.n{--c:#a8374a}
.pill{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:99px;font-weight:600}
.pill.open{background:rgba(34,197,139,.2);color:var(--ok)}.pill.closed{background:rgba(255,107,129,.2);color:var(--no)}
.bar{height:9px;border-radius:9px;background:var(--inp);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2),#2fb7ff);border-radius:9px;transition:width .4s}
.m{color:var(--m)}h1,h3{margin:.3em 0}
input,select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--b);background:var(--inp);color:var(--t);font-size:1rem;margin:5px 0}
.btn{padding:11px 18px;border:0;border-radius:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 5px 0 #3b30b5,0 10px 18px var(--sh);cursor:pointer;margin:6px 6px 8px 0;font-size:.95rem}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3b30b5}.btn.g{background:var(--inp);color:var(--t);box-shadow:0 4px 0 var(--b)}.btn.r{background:linear-gradient(135deg,#e0415d,#ff6b81);box-shadow:0 5px 0 #a02a40}
.login{max-width:380px;margin:8vh auto 0;text-align:center}.badge{width:130px;height:130px;margin:0 auto 6px;background:#fff;border-radius:28px;display:grid;place-items:center;box-shadow:0 20px 40px var(--sh);animation:bob 5s ease-in-out infinite}.badge img{width:112px}
.err{color:var(--no);min-height:1.4em;font-size:.9rem}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--b)}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--b);font-size:.88rem}th{position:sticky;top:0;background:var(--bg);color:var(--m)}td input{width:96px;margin:0;padding:7px}td.n{text-align:right}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>input,.row>select{flex:1;min-width:140px}

let reqs={},sm={},S={me:null,sel:null,fill:null,q:'',f:'all',lim:200,tab:'d',pw:[]};
const mail=id=>id.toLowerCase()+'@nexocorp-inv.com';
const fd=t=>new Date(t).toLocaleString('es-BO',{dateStyle:'short',timeStyle:'short'});
const stOf=r=>r.mode==='open'?'open':r.mode==='closed'?'closed':(Date.now()<new Date(r.deadline).getTime()?'open':'closed');
const pill=r=>`<span class="pill ${stOf(r)}">${stOf(r)==='open'?'Abierta':'Cerrada'}</span>`;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',4000)}
const ABR={lata:'LTA',unidad:'UND',caja:'CJA',frasco:'FCO',tableta:'TAB',blister:'BLI',ampolla:'AMP',sobre:'SOB',tubo:'TBO',botella:'BOT',paquete:'PQT',bolsa:'BLS',kilogramo:'KG',litro:'LT',par:'PAR',capsula:'CAP',vial:'VIA',kit:'KIT'};
const ab=u=>{u=String(u||'').trim();return ABR[u.toLowerCase()]||u.slice(0,3).toUpperCase()};
function parse(buf){const ws=XLSX.read(buf,{type:'array'});const rows=XLSX.utils.sheet_to_json(ws.Sheets[ws.SheetNames[0]],{header:1,defval:''});
 const hi=rows.findIndex(r=>r.some(c=>String(c).trim().toLowerCase()==='bodega'));if(hi<0)throw 'No encontré la fila de encabezados (Bodega)';
 const H=rows[hi].map(c=>String(c).trim().toLowerCase()),ix=n=>H.indexOf(n);
 const cB=ix('bodega'),cA=ix('articulo'),cD=H.findIndex(h=>h.startsWith('descripci')&&h.includes('art')),cQ=ix('on hand'),cU=ix('uom primaria'),cN=H.findIndex(h=>h.startsWith('descripci')&&!h.includes('art'));
 if([cB,cA,cD,cQ,cU].some(i=>i<0))throw 'Faltan columnas: Bodega, Articulo, Descripción Articulo, On Hand, UOM Primaria';
 const arts={},sys={},names={};
 const seen=new Set(),ign=new Set();
 for(const r of rows.slice(hi+1)){const b=String(r[cB]).trim(),a=String(r[cA]).trim();if(!b||!a)continue;
  if(!BODS.includes(b)){ign.add(b);continue}seen.add(b);
  if(!arts[a])arts[a]=[a,String(r[cD]).trim(),ab(r[cU])];
  (sys[b]=sys[b]||{})[a]=(sys[b][a]||0)+(Number(r[cQ])||0);if(cN>=0&&!names[b])names[b]=String(r[cN]).trim()}
 if(!seen.size)throw 'El archivo no trae ninguna de tus '+BODS.length+' bodegas';
 return{arts:Object.values(arts).sort((x,y)=>x[1].localeCompare(y[1])),sys,names,found:[...seen],ignored:ign.size}}
async function refresh(){const a=await sb.from('requests').select('*').order('created_at',{ascending:false}),b=await sb.from('bodega_status').select('*');
 reqs={};(a.data||[]).forEach(r=>reqs[r.id]=r);sm={};(b.data||[]).forEach(s=>sm[s.request_id+'__'+s.bodega]=s)}
async function loadMe(){const {data:{session}}=await sb.auth.getSession();if(!session)return;
 const {data,error}=await sb.from('profiles').select('role,bodega').eq('id',session.user.id).single();
 if(error)S.err=error.message;if(data){S.me={role:data.role,id:data.role==='admin'?'admin':data.bodega};await refresh()}}
async function login(){const u=$('#us').value.trim(),{error}=await sb.auth.signInWithPassword({email:mail(u),password:$('#pw').value});
 if(error)return $('#err').textContent=error.message==='Invalid login credentials'?'Usuario o clave incorrectos':'Error de Supabase: '+error.message;
 await loadMe();if(!S.me){await sb.auth.signOut();return $('#err').textContent='Entró, pero no tiene perfil'+(S.err?': '+S.err:'. Falta ejecutar usuarios.sql')}render()}
async function logout(){await sb.auth.signOut();S.me=S.fill=S.sel=null;render()}

const head=()=>`<div class="top"><img class="ico" src="${ICON}" alt=""><h2>Portal de Inventarios · ${S.me.role==='admin'?'Administrador':S.me.id}</h2><button class="btn g" onclick="logout()">Salir</button></div>`;
function stats(rid){const s={sent:0,prog:0,pend:0};BODS.forEach(b=>{const m=sm[rid+'__'+b];if(!m)return;m.sent?s.sent++:m.filled>0?s.prog++:s.pend++});return s}
function vList(){let h='';
 const ids=Object.keys(reqs);if(!ids.length)h+='<p class="m">Aún no hay solicitudes.</p>';
 for(const id of ids){const r=reqs[id],s=stats(id);h+=`<div class="card tilt click" onclick="S.sel='${id}';S.flt=null;S.open=false;render()">${pill(r)}<h3>${esc(r.title)}</h3><p class="m">Cierra: ${fd(r.deadline)}</p><div class="row" style="flex-wrap:nowrap">${donut(id,110)}<div>${legend(id)}</div></div></div>`}
 return h}
function vAdmin(){let h=head()+`<div class="row"><button class="btn ${S.tab==='d'?'':'g'}" onclick="S.tab='d';S.sel=null;render()">Dashboard</button><button class="btn ${S.tab==='u'?'':'g'}" onclick="S.tab='u';render()">Claves</button></div>`;
 if(S.tab==='u')return h+vUsers();if(S.sel&&reqs[S.sel])return h+vDetail();
 h+=`<div class="card" style="margin-bottom:18px"><h3>Nueva solicitud</h3><div class="row"><input id="nt" placeholder="Título (ej. Inventario cíclico diciembre)"><input id="nd" type="datetime-local"></div><input id="nf" type="file" accept=".xls,.xlsx"><p class="m" style="font-size:.85rem">Se cargan las ${BODS.length} bodegas; las que no están en el Excel entran con sistema 0.</p><button class="btn" onclick="create()">Crear solicitud</button> <span id="msg" class="m"></span></div><div id="lst" class="grid stage">${vList()}</div>`;return h}
const COL={s:'#22c58b',p:'#f5b942',n:'#ff6b81'},NM={s:'Enviadas',p:'En curso',n:'Pendientes'};
function groups(rid){const g={s:[],p:[],n:[]};BODS.forEach(b=>{const m=sm[rid+'__'+b];if(!m)return;(m.sent?g.s:m.filled>0?g.p:g.n).push(b)});return g}
const tipOf=(g,k)=>`${NM[k]} (${g[k].length})${g[k].length?': '+g[k].join(', '):''}`;
function donut(rid,z){const g=groups(rid),tot=g.s.length+g.p.length+g.n.length||1,R=40,C=2*Math.PI*R;let off=0,seg='';
 for(const k of ['s','p','n']){const n=g[k].length;if(!n)continue;const len=n/tot*C;seg+=`<circle class="seg" data-tip="${esc(tipOf(g,k))}" cx="60" cy="60" r="${R}" fill="none" stroke="${COL[k]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len}
 return`<svg viewBox="0 0 120 120" width="${z}" height="${z}" style="flex:none"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--inp)" stroke-width="16"/>${seg}<text x="60" y="60" text-anchor="middle" fill="var(--t)" font-size="20" font-weight="700">${g.s.length}/${tot}</text><text x="60" y="74" text-anchor="middle" fill="var(--m)" font-size="9">respondidas</text></svg>`}
function legend(rid){const g=groups(rid),f={sob:[],fal:[]};BODS.forEach(b=>{const m=sm[rid+'__'+b];if(!m)return;if(m.sob>0)f.sob.push(b);if(m.fal>0)f.fal.push(b)});
 const L=[['s',COL.s,g.s,'Enviadas'],['p',COL.p,g.p,'En curso'],['n',COL.n,g.n,'Pendientes'],['sob','#4cc9f0',f.sob,'Con sobrante'],['fal','#ff9f43',f.fal,'Con faltante']];
 return L.map(x=>`<div data-tip="${esc(x[3]+' ('+x[2].length+')'+(x[2].length?': '+x[2].join(', '):''))}" onclick="event.stopPropagation();goFlt('${rid}','${x[0]}')" style="font-size:.85rem;margin:3px 0;cursor:pointer"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${x[1]};margin-right:6px"></span>${x[3]}: <b>${x[2].length}</b></div>`).join('')}
const goFlt=(id,k)=>{S.sel=id;S.flt=k;S.open=true;S.tab='d';render()},setFlt=k=>{S.flt=S.flt===k?null:k;S.open=true;render()};
function hours(rid){const by={};BODS.forEach(b=>{const m=sm[rid+'__'+b];if(m&&m.sent&&m.sent_at){const d=new Date(m.sent_at),k=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()).getTime();by[k]=(by[k]||0)+1}});
 const ks=Object.keys(by).map(Number).sort((a,b)=>a-b);if(!ks.length)return'<p class="m">Aún nadie ha enviado.</p>';const mx=Math.max(...ks.map(k=>by[k])),days=new Set(ks.map(k=>new Date(k).toDateString())).size>1;
 return'<div class="hist">'+ks.map(k=>{const d=new Date(k),n=by[k];return`<div class="hc"><b>${n}</b><i style="height:${n/mx*70}px"></i><small>${d.getHours()}–${d.getHours()+1}${days?'<br>'+d.getDate()+'/'+(d.getMonth()+1):''}</small></div>`}).join('')+'</div><p class="m" style="font-size:.85rem">Bodegas que respondieron por rango de horas</p>'}
function vUsers(){return `<div class="card"><h3>Cambiar claves</h3><p class="m">Toca una bodega (o Admin) para ponerle una clave nueva.</p><div class="tiles"><div class="tile s" onclick="newPw('admin')"><b>Admin</b><small>Cambiar clave</small></div>${BODS.map(b=>`<div class="tile n" style="--c:#3a3f7a" onclick="newPw('${b}')"><b>${b}</b><small>Cambiar clave</small></div>`).join('')}</div></div>`}
async function newPw(b){const p=prompt('Nueva clave para '+b+' (mínimo 4 caracteres):');if(!p)return;if(p.length<4)return toast('Muy corta');const {error}=await sb.rpc('reset_password',{p_user:b,p_pw:p});toast(error?'Error: '+error.message:'Clave de '+b+' actualizada ✔')}
const FLT={s:'Enviadas',p:'En curso',n:'Pendientes',sob:'Con sobrante',fal:'Con faltante'};
const pass=(m,k)=>!k||(k==='s'?m.sent:k==='p'?(!m.sent&&m.filled>0):k==='n'?(!m.sent&&m.filled===0):k==='sob'?m.sob>0:m.fal>0);
function vDetail(){const id=S.sel,r=reqs[id],ms=BODS.map(b=>[b,sm[id+'__'+b]]).filter(x=>x[1]),cn=k=>ms.filter(x=>pass(x[1],k)).length;
 let h=`<button class="btn g" onclick="S.sel=null;S.flt=null;render()">← Volver</button><div class="card" style="margin-bottom:18px">${pill(r)} <b>${esc(r.title)}</b><p class="m">Cierra: ${fd(r.deadline)} · Modo: ${r.mode==='open'?'abierta manual':r.mode==='closed'?'cerrada manual':'automático'}</p>
 <button class="btn" onclick="setMode('open')">Abrir</button><button class="btn r" onclick="setMode('closed')">Cerrar</button><button class="btn g" onclick="setMode('auto')">Automático</button><button class="btn g" onclick="exportX()">Exportar Excel</button><button class="btn r" onclick="del()">Eliminar solicitud</button>
 <div class="row"><input id="nd" type="datetime-local"><button class="btn g" onclick="setDl()">Cambiar fecha límite</button></div></div>
 <div class="card" style="margin-bottom:18px"><div class="row" style="align-items:flex-start;gap:24px">${donut(id,190)}<div style="flex:1;min-width:240px"><h3>Respuestas por hora</h3>${hours(id)}</div><div>${legend(id)}</div></div></div>
 <div class="row"><button class="btn g" onclick="S.open=!S.open;render()">${S.open?'▾':'▸'} Bodegas (${ms.length})</button>${['s','p','n','sob','fal'].map(k=>`<button class="btn ${S.flt===k?'':'g'}" onclick="setFlt('${k}')">${FLT[k]} ${cn(k)}</button>`).join('')}${S.flt?'<button class="btn g" onclick="setFlt(null)">Ver todas</button>':''}</div>`;
 if(S.open){h+='<div class="tiles stage">';for(const [b,m] of ms){if(!pass(m,S.flt))continue;const c=m.sent?'s':m.filled>0?'p':'n',t=m.sent_at?' '+new Date(m.sent_at).toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'}):'';
  h+=`<div class="tile tilt ${c}" data-tip="${esc(m.sent&&m.sent_at?'Enviada '+fd(m.sent_at):m.filled>0?'En curso':'Pendiente')}" onclick="openFill('${id}','${b}')"><b>${b}</b><small>${esc((r.names||{})[b]||'')}</small>${Math.round(m.filled/(m.total||1)*100)}% · ${m.sent?'Enviada'+t:m.filled>0?'En curso':'Pendiente'}${m.sob>0||m.fal>0?`<br>${m.sob>0?`<span style="color:#4cc9f0">▲${m.sob}</span> `:''}${m.fal>0?`<span style="color:#ff9f43">▼${m.fal}</span>`:''}`:''}</div>`}
  h+='</div><p class="m" style="font-size:.85rem">▲ artículos con sobrante · ▼ artículos con faltante</p>'}
 return h}
async function setMode(m){await sb.from('requests').update({mode:m}).eq('id',S.sel);await refresh();render()}
async function setDl(){const t=new Date($('#nd').value);if(isNaN(t))return toast('Elige fecha y hora');await sb.from('requests').update({deadline:t.toISOString(),mode:'auto'}).eq('id',S.sel);await refresh();render()}
async function del(){if(!confirm('¿Eliminar esta solicitud y TODOS sus datos? No se puede deshacer.'))return;toast('Eliminando…');
 const {error}=await sb.rpc('delete_request',{p_req:S.sel});if(error)return toast('Error: '+error.message);S.sel=null;await refresh();render();toast('Solicitud eliminada y espacio liberado')}
async function create(){const t=$('#nt').value.trim(),d=new Date($('#nd').value),f=$('#nf').files[0];if(!t||isNaN(d)||!f)return toast('Completa título, fecha límite y archivo');
 const msg=x=>$('#msg').textContent=x;let rid;try{const {data:u,error:ue}=await sb.auth.getUser();if(ue||!u.user){await logout();return toast('Tu sesión venció. Ingresa de nuevo')}
 const P=parse(await f.arrayBuffer());
 const {data:r,error}=await sb.from('requests').insert({title:t,deadline:d.toISOString(),names:P.names}).select().single();if(error)throw error;rid=r.id;
 for(let i=0;i<P.arts.length;i+=1000){const {error}=await sb.from('articles').insert(P.arts.slice(i,i+1000).map(a=>({request_id:rid,codigo:a[0],descripcion:a[1],uom:a[2]})));if(error)throw error;msg(`Artículos ${Math.min(i+1000,P.arts.length)}/${P.arts.length}`)}
 msg('Creando bodegas…');let e=(await sb.rpc('seed_request',{p_req:rid,p_bods:BODS})).error;if(e)throw e;
 const sys=[];for(const b in P.sys)for(const a in P.sys[b])if(P.sys[b][a]!==0)sys.push([b,a,P.sys[b][a]]);
 for(let i=0;i<sys.length;i+=4000){e=(await sb.rpc('apply_sys',{p_req:rid,p_sys:sys.slice(i,i+4000)})).error;if(e)throw e;msg(`Cantidades ${Math.min(i+4000,sys.length)}/${sys.length}`)}
 await refresh();S.sel=rid;render();toast(`Solicitud creada: ${P.arts.length} artículos · ${P.found.length} bodegas tomadas del archivo, ${BODS.length-P.found.length} con sistema 0, ${P.ignored} ajenas ignoradas`)}catch(e){if(rid)await sb.rpc('delete_request',{p_req:rid});msg('Error: '+(e.message||e)+(String(e.message).includes('row-level')?' · Cierra sesión y entra de nuevo como admin':''))}}
async function page(q){const out=[];for(let i=0;;i+=1000){const {data,error}=await q().range(i,i+999);if(error)throw error;out.push(...data);if(data.length<1000)return out}}
async function exportX(){const id=S.sel,r=reqs[id];toast('Preparando Excel…');try{
 const d=await page(()=>sb.from('counts').select('bodega,sistema,fisico,article_id,articles!inner(codigo,descripcion,uom,request_id)').eq('articles.request_id',id).order('bodega').order('article_id'));
 const out=[['Solicitud','Bodega','Tienda','Artículo','Descripción','UOM','Sistema','Físico','Diferencia']];
 d.forEach(x=>out.push([r.title,x.bodega,(r.names||{})[x.bodega]||'',x.articles.codigo,x.articles.descripcion,x.articles.uom,Number(x.sistema),x.fisico==null?'':Number(x.fisico),x.fisico==null?'':x.fisico-x.sistema]));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(out),'Inventario');XLSX.writeFile(wb,'inventario_'+r.title.replace(/[^\w]+/g,'_')+'.xlsx')}catch(e){toast('Error exportando')}}
function vBod(){let h=head()+'<div class="grid stage">';const ids=Object.keys(reqs).filter(id=>sm[id+'__'+S.me.id]&&(reqs[id].mode==='open'||Date.now()<new Date(reqs[id].deadline).getTime()+864e5));
 if(!ids.length)h+='<p class="m">No tienes solicitudes asignadas.</p>';
 for(const id of ids){const r=reqs[id],m=sm[id+'__'+S.me.id];h+=`<div class="card tilt click" onclick="openFill('${id}','${S.me.id}')">${pill(r)} ${m.sent?'<span class="pill open">Enviada</span>':''}<h3>${esc(r.title)}</h3><p class="m">Cierra: ${fd(r.deadline)}</p><div class="bar"><i style="width:${m.filled/(m.total||1)*100}%"></i></div><p style="margin:0">${m.filled}/${m.total} artículos llenos</p></div>`}
 return h+'</div>'}
async function openFill(rid,bod){S.fill={rid,bod,ro:false,adm:S.me.role==='admin',rows:null,dirty:new Set()};S.q='';S.f='all';S.lim=200;render();
 try{const d=await page(()=>sb.from('counts').select('article_id,sistema,fisico,articles!inner(codigo,descripcion,uom,request_id)').eq('bodega',bod).eq('articles.request_id',rid).order('article_id'));
 S.fill.rows=d.map(x=>[x.articles.codigo,x.articles.descripcion,Number(x.sistema),x.articles.uom,x.fisico==null?null:Number(x.fisico),x.article_id]);render()}catch(e){toast('Error cargando artículos')}}
const sentOf=f=>!!(sm[f.rid+'__'+f.bod]||{}).sent,locked=()=>S.fill.adm?false:stOf(reqs[S.fill.rid])!=='open'||sentOf(S.fill);
function vFill(){const f=S.fill,r=reqs[f.rid];return`<button class="btn g" onclick="S.fill=null;render()">← Volver</button><div class="card" style="margin-bottom:14px">${pill(r)} <b>${esc(r.title)}</b> · <b>${f.bod}</b> <span class="m">${esc((r.names||{})[f.bod]||'')}</span><p class="m" style="margin:4px 0">Cierra: ${fd(r.deadline)}${f.adm?' · Modo administrador: puedes corregir':''}</p>${f.rows?`<div class="bar"><i id="pb"></i></div><div id="cnt"></div><div class="row"><input placeholder="Buscar artículo o descripción" oninput="S.q=this.value;S.lim=200;paint()"><select onchange="S.f=this.value;S.lim=200;paint()"><option value="all">Todos</option><option value="pend">Solo pendientes</option><option value="dif">Solo diferencias</option></select></div>${f.adm?admBtns(f):sentOf(f)?'<p class="pill open">Inventario enviado · ya no se puede modificar</p>':'<button class="btn g" onclick="save(false)">Guardar avance</button><button class="btn" onclick="save(true)">Enviar inventario</button>'}`:'<p class="m">Cargando artículos…</p>'}</div>${f.rows?'<div id="tb" class="tw"></div>':''}`}
function cnt(){const f=S.fill,n=f.rows.filter(r=>r[4]!==null).length;$('#cnt').innerHTML=`<b>${n}</b> de ${f.rows.length} llenos`;$('#pb').style.width=n/(f.rows.length||1)*100+'%'}
function paint(){const f=S.fill;if(!f||!f.rows)return;const q=S.q.toLowerCase(),L=locked();let n=0,h='<table><tr><th>Artículo</th><th>Descripción</th><th>UOM</th><th>Sistema</th><th>Físico</th>'+(f.adm?'<th>Dif.</th>':'')+'</tr>',more=false;
 f.rows.forEach((r,i)=>{if(S.f==='pend'&&r[4]!==null)return;if(S.f==='dif'&&!(r[4]!==null&&r[4]!==r[2]))return;if(q&&!(r[0]+' '+r[1]).toLowerCase().includes(q))return;if(n++>=S.lim){more=true;return}
  h+=`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[3])}</td><td class="n">${r[2]}</td><td><input type="number" min="0" step="any" inputmode="decimal" value="${r[4]??''}" ${L?'disabled':''} oninput="setPh(${i},this.value)"></td>${f.adm?dif(r):''}</tr>`});
 $('#tb').innerHTML=h+'</table>'+(more?'<button class="btn g" onclick="S.lim+=300;paint()">Mostrar más</button>':'');cnt()}
const dif=r=>{if(r[4]==null)return'<td></td>';const d=+(r[4]-r[2]).toFixed(3);return`<td class="n" style="color:${d>0?'#4cc9f0':d<0?'#ff9f43':'inherit'}">${d>0?'+':''}${d}</td>`};
function setPh(i,v){const r=S.fill.rows[i];r[4]=v===''?null:Math.max(0,Number(v));S.fill.dirty.add(i);cnt()}
const call=(f,rows,send)=>f.adm?sb.rpc('admin_save_counts',{p_req:f.rid,p_bod:f.bod,p_rows:rows}):sb.rpc('save_counts',{p_req:f.rid,p_rows:rows,p_send:!!send});
const admBtns=f=>'<button class="btn" onclick="save(false)">Guardar cambios</button>'+(sentOf(f)?'<button class="btn g" onclick="reopen()">Reabrir para la bodega</button>':'');
async function reopen(){const f=S.fill,{error}=await sb.rpc('reopen_bodega',{p_req:f.rid,p_bod:f.bod});if(error)return toast('Error: '+error.message);await refresh();render();toast(stOf(reqs[f.rid])==='open'?'Reabierta: la bodega puede modificar y volver a enviar':'Reabierta. Presiona Abrir en la solicitud para que pueda editar')}
async function save(send){const f=S.fill;if(locked())return toast(sentOf(f)?'Ya enviaste este inventario':'La solicitud está cerrada');const n=f.rows.filter(r=>r[4]!==null).length;
 if(send&&n<f.rows.length)return toast(`Faltan ${f.rows.length-n} artículos por llenar`);
 const ch=[...f.dirty].map(i=>[f.rows[i][5],f.rows[i][4]]);try{
 for(let i=0;i<ch.length;i+=2000){const {error}=await call(f,ch.slice(i,i+2000),false);if(error)throw error}
 const {error}=await call(f,[],send);if(error)throw error;f.dirty.clear();await refresh();
 toast(send?'Inventario enviado ✔':'Avance guardado ✔');if(send)render()}catch(e){toast('No se pudo guardar: '+(e.message||'intenta de nuevo'))}}
function render(){const a=$('#app');a.innerHTML=!S.me?vLogin():S.fill?vFill():S.me.role==='admin'?vAdmin():vBod();if(S.fill&&S.fill.rows)paint()}
const tip=e=>{const t=e.target.closest&&e.target.closest('[data-tip]'),d=$('#tip');if(!t){d.style.display='none';return}d.textContent=t.dataset.tip;d.style.display='block';d.style.left=Math.min(e.clientX+14,innerWidth-270)+'px';d.style.top=(e.clientY+16)+'px'};
document.addEventListener('mouseover',tip);document.addEventListener('mousemove',tip);document.addEventListener('click',tip);
document.addEventListener('mousemove',e=>{const c=$('.lgC');if(!c)return;c.style.setProperty('--ry',((e.clientX/innerWidth-.3)*18)+'deg');c.style.setProperty('--rx',(-(e.clientY/innerHeight-.7)*14)+'deg')});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#us')&&!S.me)login()});
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('.tilt');if(!t)return;const b=t.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;t.style.transform=`rotateX(${-y*10}deg) rotateY(${x*12}deg) translateZ(10px)`});
document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('.tilt');if(t&&!t.contains(e.relatedTarget))t.style.transform=''});
setInterval(async()=>{if(!S.me||S.fill)return;await refresh();const l=$('#lst');if(l){l.innerHTML=vList();return}
 const a=document.activeElement,busy=(a&&a.tagName==='INPUT')||[...document.querySelectorAll('#app input')].some(i=>i.value||(i.files&&i.files.length));if(!busy)render()},20000);
loadMe().then(render);
</script></body></html>
